name: CI (validation gate)

# false-done 차단의 외부·결정론적 층(config/work-unit-contract.md §C). dev `/goal`·무인 루프
# 성공조건의 Validation 명령을 PR/푸시에서 *비-LLM*으로 재실행한다.
# R6(2026-06-16): npm no-op 스텁 → pnpm + 실제 모노레포 스크립트로 갱신(tsc·lint·lint:fsd·build·vitest
#   + apps/extension wxt build + pglite pgTAP). supabase Docker pgTAP는 u0b-canonical-tests.yml가 별도 게이트.

on:
  pull_request:
    branches: [main, "sprint/**"]
  push:
    branches: [main, "sprint/**"]

jobs:
  web:
    name: apps/web (tsc · lint · lint:fsd · build · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: tsc -b (apps/web)
        run: pnpm -C apps/web exec tsc -b --force
      - name: eslint (apps/web)
        run: pnpm -C apps/web exec eslint .
      - name: steiger (lint:fsd — FSD 경계)
        run: pnpm exec steiger ./apps/web/src
      - name: build (apps/web)
        run: pnpm -C apps/web build
      - name: vitest (apps/web contract/unit)
        run: pnpm -C apps/web test

  extension:
    name: apps/extension (tsc --noEmit · wxt build · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit (apps/extension)
        run: pnpm -C apps/extension exec tsc --noEmit
      - name: wxt build (MV3 chrome)
        run: pnpm -C apps/extension exec wxt build
      - name: vitest (apps/extension contract/unit)
        run: pnpm -C apps/extension test

  pgtap:
    name: supabase pgTAP (pglite — no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: pgTAP via pglite (마이그 0001~0013 + tests/*.sql)
        run: node supabase/tests/_pgtap_pglite.mjs
